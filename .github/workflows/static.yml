name: Build and deploy papers to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: sources
          submodules: true

      - name: Build papers and landing page
        run: make -C sources html index

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Stage Pages site
        run: |
          set -euo pipefail

          mkdir -p _site
          cp -a sources/generated/. _site/

          find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
