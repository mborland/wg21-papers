name: Build and deploy papers to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: sources
          submodules: true

      - name: Build papers
        run: make -C sources html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Stage Pages site
        run: |
          set -euo pipefail

          mkdir -p _pages
          cp -a sources/generated/. _pages/

          sed -E \
            -e '1i---\ntitle: C++ Committee Papers\n---\n' \
            -e 's#^(\[[^]]+\]: )generated/#\1#' \
            sources/README.md > _pages/index.md

          find _pages -type f | sort

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: _pages
          destination: _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
